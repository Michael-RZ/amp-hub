<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>AMP Hub - Signing in with Microsoft</title>
  <style>
    body { margin: 0; font: 16px/1.55 system-ui, Segoe UI, Arial, sans-serif; color: #1f2933; background: #f4f5f7; }
    main { max-width: 640px; margin: 80px auto; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 28px 32px; }
    h1 { font-size: 20px; margin: 0 0 10px; }
    a { color: #1f5fbf; }
  </style>
</head>
<body>
<main>
  <h1>Returning to AMP Hub...</h1>
  <p id="msg">Finishing the Microsoft sign-in.</p>
</main>
<script>
  // Microsoft only sends a browser back to an https address. AMP Hub runs on the office network over plain
  // http, so Microsoft sends the browser here and this page passes the sign-in straight on to the AMP Hub
  // that started it - the same arrangement as callback.html for QuickBooks. That hub's address travels in
  // the "state" value, which the hub generated, also put in a cookie in this browser, and checks again on
  // arrival. The code is useless without the hub's own secret and its PKCE verifier; nothing is kept here.
  (function () {
    var q = new URLSearchParams(location.search);
    var state = q.get('state') || '';
    var m = state.match(/~([A-Za-z0-9.-]+)(?::(\d{2,5}))?$/);
    // Only ever forward to AMP's own machines: the office server or a developer's own PC.
    var allowed = ['localhost', '127.0.0.1', 'amp-server', 'amp-server.local'];
    var name = m ? m[1].toLowerCase() : 'localhost';
    if (allowed.indexOf(name) < 0) { name = 'localhost'; }
    var host = name + ':' + (m && m[2] ? m[2] : '5161');
    var target = 'http://' + host + '/api/auth/microsoft/callback?' + q.toString();
    document.getElementById('msg').innerHTML = 'If you are not taken back automatically, <a href="' + target.replace(/"/g, '&quot;') + '">click here</a>.';
    location.replace(target);
  })();
</script>
</body>
</html>
